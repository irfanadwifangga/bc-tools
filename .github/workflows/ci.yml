name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --locked --all-packages ruff check .
      - run: uv run --locked --all-packages ruff format --check .
      - run: uv run --locked --all-packages mypy
      - run: uv run --locked --all-packages pytest
